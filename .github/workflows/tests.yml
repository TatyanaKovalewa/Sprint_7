name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: API-тесты
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin
          cache: maven

      # Часть тестов стабильно падает из-за дефектов учебного стенда, а не из-за ошибок в тестах.
      # Поэтому прогон не роняет сборку сразу — вердикт выносит следующий шаг.
      - name: Прогнать тесты
        id: run_tests
        continue-on-error: true
        run: mvn -B test

      - name: Сверить падения с известными дефектами стенда
        run: python3 .github/check-known-failures.py

      - name: Собрать отчёт Allure
        if: always()
        run: mvn -B allure:report

      - name: Сохранить отчёт как артефакт сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          if-no-files-found: error

      - name: Подготовить отчёт для GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven-plugin

  deploy:
    name: Опубликовать отчёт на GitHub Pages
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Развернуть на Pages
        id: deployment
        uses: actions/deploy-pages@v4
